name: Daily publishing
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit: ${{ steps.commit.outputs.commit }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      FREE_TIER_ONLY: 'true'
      GEMINI_MODEL: gemini-2.5-flash
      MAX_LLM_CALLS: '4'
      MAX_ARTICLES_PER_DAY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run bounded publication pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run pipeline
      - name: Verify content and build before committing
        run: |
          npm run verify:content
          npm run check
      - name: Commit only a newly validated article
        id: commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AUTHOR_NAME: ${{ vars.PUBLISH_AUTHOR_NAME || 'github-actions[bot]' }}
          AUTHOR_EMAIL: ${{ vars.PUBLISH_AUTHOR_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const state = JSON.parse(readFileSync('data/pipeline-state.json', 'utf8'));
          if (state.runs.at(-1)?.publicationResult !== 'published') process.exit(0);
          if (!process.env.AUTHOR_NAME?.trim() || /[\r\n]/.test(process.env.AUTHOR_NAME)) throw new Error('Invalid author name');
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(process.env.AUTHOR_EMAIL ?? '')) throw new Error('Invalid author email');
          NODE
          if [ "$(node -p "JSON.parse(require('fs').readFileSync('data/pipeline-state.json','utf8')).runs.at(-1)?.publicationResult")" != 'published' ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -- content/articles/
          if git diff --cached --quiet -- content/articles/; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -- data/pipeline-state.json
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          git commit -m 'content: publish validated engineering dispatch'
          git push origin "HEAD:$DEFAULT_BRANCH"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Retain non-sensitive metrics for skipped and failed runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pipeline-metrics-${{ github.run_id }}
          path: data/pipeline-state.json
          retention-days: 7
  deploy:
    needs: publish
    if: needs.publish.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      commit: ${{ needs.publish.outputs.commit }}
